name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf "%s\n" "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: build
        run: go build ./...

      - name: Two-process fleet configuration digest smoke
        run: |
          go build -o "$RUNNER_TEMP/go-router" ./cmd/go-router
          go build -o "$RUNNER_TEMP/go-router-dashboard" ./cmd/go-router-dashboard
          python3 scripts/smoke-fleet-digest.py "$RUNNER_TEMP/go-router" "$RUNNER_TEMP/go-router-dashboard"

      - name: Loopback synthetic Chat process smoke
        run: |
          go build -o "$RUNNER_TEMP/go-router" ./cmd/go-router
          python3 scripts/smoke-synthetic-chat.py "$RUNNER_TEMP/go-router"
