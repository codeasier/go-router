name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: build
        run: go build ./...

      - name: Loopback synthetic Chat process smoke
        run: |
          go build -o "$RUNNER_TEMP/go-router" ./cmd/go-router
          python3 scripts/smoke-synthetic-chat.py "$RUNNER_TEMP/go-router"
